<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Comparador de Coches Fácil</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Outfit', sans-serif;
            background-color: #f8fafc;
            color: #1e293b;
        }
        /* Aumentar contraste y tamaño por defecto */
        .accessible-text {
            font-size: 1.125rem; /* text-lg */
            line-height: 1.75rem;
        }
        .accessible-heading {
            font-size: 1.875rem; /* text-3xl */
            font-weight: 700;
        }
        .btn-primary {
            background-color: #2563eb;
            color: white;
            padding: 1rem 1.5rem;
            border-radius: 0.75rem;
            font-size: 1.25rem;
            font-weight: 600;
            transition: all 0.2s;
            border: 2px solid transparent;
        }
        .btn-primary:hover {
            background-color: #1d4ed8;
            transform: scale(1.02);
            box-shadow: 0 10px 15px -3px rgba(37, 99, 235, 0.4);
        }
        .btn-primary:focus {
            outline: none;
            border-color: #1e40af;
            box-shadow: 0 0 0 4px rgba(37, 99, 235, 0.3);
        }
        .btn-secondary {
            background-color: #e2e8f0;
            color: #0f172a;
            padding: 1rem 1.5rem;
            border-radius: 0.75rem;
            font-size: 1.25rem;
            font-weight: 600;
            transition: all 0.2s;
            border: 2px solid transparent;
        }
        .btn-secondary:hover {
            background-color: #cbd5e1;
            transform: scale(1.02);
        }
        .btn-secondary:focus {
            outline: none;
            border-color: #94a3b8;
            box-shadow: 0 0 0 4px rgba(148, 163, 184, 0.3);
        }
        .btn-outline {
            background-color: transparent;
            color: #2563eb;
            border: 2px solid #2563eb;
            padding: 1rem 1.5rem;
            border-radius: 0.75rem;
            font-size: 1.25rem;
            font-weight: 600;
            transition: all 0.2s;
        }
        .btn-outline:hover {
            background-color: #eff6ff;
        }
        
        .card {
            background: white;
            border-radius: 1rem;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
            border: 1px solid #e2e8f0;
            transition: all 0.3s ease;
            overflow: hidden;
        }
        .card:hover {
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1), 0 10px 10px -5px rgba(0, 0, 0, 0.04);
            transform: translateY(-4px);
        }
        
        /* Modal transitions */
        .modal-bg {
            background-color: rgba(15, 23, 42, 0.75);
            backdrop-filter: blur(4px);
        }
        
        /* Form elements */
        select, input[type="number"] {
            font-size: 1.125rem;
            padding: 0.75rem 1rem;
            border-radius: 0.5rem;
            border: 2px solid #cbd5e1;
            background-color: white;
            color: #0f172a;
            width: 100%;
        }
        select:focus, input[type="number"]:focus {
            outline: none;
            border-color: #2563eb;
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.2);
        }
        label {
            font-size: 1.125rem;
            font-weight: 600;
            color: #334155;
            margin-bottom: 0.5rem;
            display: block;
        }
        
        /* Loader */
        .loader {
            border: 5px solid #f3f3f3;
            border-top: 5px solid #2563eb;
            border-radius: 50%;
            width: 50px;
            height: 50px;
            animation: spin 1s linear infinite;
            margin: 2rem auto;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body class="min-h-screen flex flex-col">

    <!-- Encabezado -->
    <header class="bg-blue-700 text-white p-6 shadow-md sticky top-0 z-30">
        <div class="max-w-7xl mx-auto flex justify-between items-center">
            <h1 class="text-3xl font-bold flex items-center gap-3">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-10 w-10" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 16H6a2 2 0 01-2-2V6a2 2 0 012-2h8a2 2 0 012 2v2m-6 12h8a2 2 0 002-2v-8a2 2 0 00-2-2h-8a2 2 0 00-2 2v8a2 2 0 002 2z" />
                </svg>
                Buscador y Comparador de Coches
            </h1>
            
            <button id="btnVerComparador" class="bg-yellow-400 hover:bg-yellow-500 text-slate-900 font-bold py-3 px-6 rounded-xl text-xl shadow-lg transition-transform transform hover:scale-105 hidden items-center gap-2">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 10h18M7 15h1m4 0h1m-7 4h12a3 3 0 003-3V8a3 3 0 00-3-3H6a3 3 0 00-3 3v8a3 3 0 003 3z" />
                </svg>
                Ver Comparativa (<span id="contadorCoches">0</span>)
            </button>
        </div>
    </header>

    <main class="flex-grow flex flex-col md:flex-row max-w-screen-2xl mx-auto w-full p-4 gap-6">
        
        <!-- Panel de Filtros -->
        <aside class="w-full md:w-1/4 bg-white p-6 rounded-2xl shadow-md border-2 border-slate-200 h-fit sticky top-28">
            <h2 class="text-2xl font-bold mb-6 text-slate-800 flex items-center gap-2">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-7 w-7 text-blue-600" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 4a1 1 0 011-1h16a1 1 0 011 1v2.586a1 1 0 01-.293.707l-6.414 6.414a1 1 0 00-.293.707V17l-4 4v-6.586a1 1 0 00-.293-.707L3.293 7.293A1 1 0 013 6.586V4z" />
                </svg>
                Filtros de Búsqueda
            </h2>
            
            <form id="formFiltros" class="space-y-6">
                <!-- Marca -->
                <div>
                    <label for="filtroMarca">Marca del coche</label>
                    <select id="filtroMarca" name="marca">
                        <option value="">Todas las marcas</option>
                        <!-- Rellenado por JS -->
                    </select>
                </div>

                <!-- Tipo Combustible -->
                <div>
                    <label for="filtroCombustible">Motor / Combustible</label>
                    <select id="filtroCombustible" name="combustible">
                        <option value="">Todos los tipos</option>
                        <option value="Gasolina">Gasolina (Etiqueta C)</option>
                        <option value="Diésel">Diésel (Etiqueta C)</option>
                        <option value="HEV">Híbrido (Etiqueta ECO)</option>
                        <option value="MHEV">Microhíbrido (Etiqueta ECO)</option>
                        <option value="PHEV">Híbrido Enchufable (Etiqueta CERO)</option>
                        <option value="Eléctrico">100% Eléctrico (Etiqueta CERO)</option>
                    </select>
                </div>

                <!-- Carrocería -->
                <div>
                    <label for="filtroCarroceria">Tipo de carrocería</label>
                    <select id="filtroCarroceria" name="carroceria">
                        <option value="">Cualquier tipo</option>
                        <option value="SUV">SUV / Todocamino</option>
                        <option value="Crossover">Crossover</option>
                        <option value="Hatchback">Compacto (5 puertas)</option>
                        <option value="Sedán">Sedán (4 puertas)</option>
                        <option value="Ranchera">Ranchera / Familiar</option>
                        <option value="Monovolumen">Monovolumen</option>
                    </select>
                </div>

                <!-- Precio Máximo -->
                <div>
                    <label for="filtroPrecioMax">Precio Máximo (€)</label>
                    <input type="number" id="filtroPrecioMax" name="precio_max" placeholder="Ej: 30000" step="1000" min="0">
                </div>

                <!-- Maletero Mínimo -->
                <div>
                    <label for="filtroMaleteroMin">Maletero Mínimo (Litros)</label>
                    <input type="number" id="filtroMaleteroMin" name="maletero_min" placeholder="Ej: 400" step="10" min="0">
                </div>

                <div class="pt-4 flex flex-col gap-3">
                    <button type="submit" class="btn-primary w-full flex justify-center items-center gap-2">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" />
                        </svg>
                        Buscar Coches
                    </button>
                    <button type="button" id="btnLimpiar" class="btn-secondary w-full">
                        Limpiar Filtros
                    </button>
                </div>
            </form>
        </aside>

        <!-- Resultados -->
        <section class="w-full md:w-3/4">
            
            <!-- Indicador de Carga -->
            <div id="loaderContenedor" class="hidden">
                <div class="loader"></div>
                <p class="text-center text-xl text-slate-600 font-semibold mt-4">Buscando los mejores coches para ti...</p>
            </div>
            
            <!-- Mensaje de error / sin resultados -->
            <div id="mensajeResultados" class="hidden bg-blue-50 border-l-4 border-blue-500 p-6 rounded-lg mb-6 shadow-sm">
                <p class="text-xl text-blue-800 font-medium"></p>
            </div>

            <!-- Grid de Coches -->
            <div id="gridCoches" class="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-3 gap-8 pb-12">
                <!-- Rellenado por JS -->
            </div>
            
        </section>

    </main>

    <!-- Modal del Comparador -->
    <div id="modalComparador" class="fixed inset-0 z-50 hidden modal-bg flex items-center justify-center p-4">
        <div class="bg-white rounded-2xl shadow-2xl w-full max-w-6xl max-h-[90vh] flex flex-col overflow-hidden">
            
            <!-- Header del modal -->
            <div class="bg-slate-100 px-6 py-4 border-b border-slate-200 flex justify-between items-center">
                <h2 class="text-3xl font-bold text-slate-800">Comparativa de Coches</h2>
                <button id="btnCerrarModal" class="text-slate-500 hover:text-red-600 transition-colors p-2 rounded-full hover:bg-slate-200 focus:outline-none focus:ring-4 focus:ring-red-200">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-10 w-10" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
                    </svg>
                </button>
            </div>
            
            <!-- Contenido del modal (Tabla) -->
            <div class="p-6 overflow-x-auto flex-grow bg-slate-50">
                <div class="min-w-[800px]">
                    <table class="w-full text-left bg-white rounded-xl shadow-sm border-hidden outline outline-1 outline-slate-200" style="border-collapse: separate; border-spacing: 0;">
                        <thead>
                            <tr>
                                <th class="p-4 border-b border-r border-slate-200 w-1/4 bg-slate-100 rounded-tl-xl text-xl text-slate-600 font-bold">Característica</th>
                                <!-- Columnas de coches inyectadas aquí -->
                                <th id="thCoche1" class="p-4 border-b border-r border-slate-200 w-1/4 align-top"></th>
                                <th id="thCoche2" class="p-4 border-b border-r border-slate-200 w-1/4 align-top"></th>
                                <th id="thCoche3" class="p-4 border-b border-slate-200 w-1/4 align-top rounded-tr-xl"></th>
                            </tr>
                        </thead>
                        <tbody class="text-lg">
                            <tr class="hover:bg-slate-50">
                                <td class="p-4 border-b border-r border-slate-200 font-bold text-slate-700 bg-slate-50">Precio Base</td>
                                <td id="tdPrecio1" class="p-4 border-b border-r border-slate-200 font-bold text-blue-700 text-2xl"></td>
                                <td id="tdPrecio2" class="p-4 border-b border-r border-slate-200 font-bold text-blue-700 text-2xl"></td>
                                <td id="tdPrecio3" class="p-4 border-b border-slate-200 font-bold text-blue-700 text-2xl"></td>
                            </tr>
                            <tr class="hover:bg-slate-50">
                                <td class="p-4 border-b border-r border-slate-200 font-bold text-slate-700 bg-slate-50">Motor / Combustible</td>
                                <td id="tdMotor1" class="p-4 border-b border-r border-slate-200"></td>
                                <td id="tdMotor2" class="p-4 border-b border-r border-slate-200"></td>
                                <td id="tdMotor3" class="p-4 border-b border-slate-200"></td>
                            </tr>
                            <tr class="hover:bg-slate-50">
                                <td class="p-4 border-b border-r border-slate-200 font-bold text-slate-700 bg-slate-50">Potencia</td>
                                <td id="tdCV1" class="p-4 border-b border-r border-slate-200"></td>
                                <td id="tdCV2" class="p-4 border-b border-r border-slate-200"></td>
                                <td id="tdCV3" class="p-4 border-b border-slate-200"></td>
                            </tr>
                            <tr class="hover:bg-slate-50">
                                <td class="p-4 border-b border-r border-slate-200 font-bold text-slate-700 bg-slate-50">Consumo (L o kWh)</td>
                                <td id="tdConsumo1" class="p-4 border-b border-r border-slate-200"></td>
                                <td id="tdConsumo2" class="p-4 border-b border-r border-slate-200"></td>
                                <td id="tdConsumo3" class="p-4 border-b border-slate-200"></td>
                            </tr>
                            <tr class="hover:bg-slate-50">
                                <td class="p-4 border-b border-r border-slate-200 font-bold text-slate-700 bg-slate-50">Maletero</td>
                                <td id="tdMaletero1" class="p-4 border-b border-r border-slate-200 font-semibold text-green-700"></td>
                                <td id="tdMaletero2" class="p-4 border-b border-r border-slate-200 font-semibold text-green-700"></td>
                                <td id="tdMaletero3" class="p-4 border-b border-slate-200 font-semibold text-green-700"></td>
                            </tr>
                            <tr class="hover:bg-slate-50">
                                <td class="p-4 border-b border-r border-slate-200 font-bold text-slate-700 bg-slate-50 rounded-bl-xl">Dimensiones (L x An x Al)</td>
                                <td id="tdDim1" class="p-4 border-b border-r border-slate-200"></td>
                                <td id="tdDim2" class="p-4 border-b border-r border-slate-200"></td>
                                <td id="tdDim3" class="p-4 border-b border-slate-200 rounded-br-xl"></td>
                            </tr>
                            <tr class="hover:bg-slate-50">
                                <td class="p-4 border-t border-r border-slate-200 font-bold text-slate-700 bg-slate-50 rounded-bl-xl">Enlaces Externos</td>
                                <td id="tdLinks1" class="p-4 border-t border-r border-slate-200 flex-col gap-2"></td>
                                <td id="tdLinks2" class="p-4 border-t border-r border-slate-200 flex-col gap-2"></td>
                                <td id="tdLinks3" class="p-4 border-t border-slate-200 flex-col gap-2"></td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
            
            <div class="bg-white p-6 border-t border-slate-200 flex justify-end">
                <button id="btnVaciarComparador" class="btn-outline mr-4 flex items-center gap-2">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" />
                    </svg>
                    Vaciar Comparativa
                </button>
                <button id="btnVolverABuscar" class="btn-primary">
                    Volver a los resultados
                </button>
            </div>
        </div>
    </div>

    <script>
        // ESTADO DE LA APLICACIÓN
        let cochesComparar = [];
        let todosLosCoches = [];
        let marcasActivas = [];

        // ELEMENTOS DEL DOM
        const formFiltros = document.getElementById('formFiltros');
        const gridCoches = document.getElementById('gridCoches');
        const loader = document.getElementById('loaderContenedor');
        const mensajeResultados = document.getElementById('mensajeResultados');
        const selMarca = document.getElementById('filtroMarca');
        
        const btnVerComparador = document.getElementById('btnVerComparador');
        const contadorCoches = document.getElementById('contadorCoches');
        const modalComparador = document.getElementById('modalComparador');
        const btnCerrarModal = document.getElementById('btnCerrarModal');
        const btnVolverABuscar = document.getElementById('btnVolverABuscar');
        const btnVaciarComparador = document.getElementById('btnVaciarComparador');
        const btnLimpiar = document.getElementById('btnLimpiar');

        // INICIALIZACIÓN
        document.addEventListener('DOMContentLoaded', async () => {
            await cargarFiltrosIniciales();
            await buscarCoches(); // Carga inicial sin filtros
        });

        // FUNCIONES DE API
        async function cargarFiltrosIniciales() {
            try {
                const response = await fetch('/api/marcas');
                if (!response.ok) throw new Error('Error al cargar marcas');
                marcasActivas = await response.json();
                
                marcasActivas.sort((a, b) => a.nombre.localeCompare(b.nombre)).forEach(marca => {
                    const opt = document.createElement('option');
                    opt.value = marca.id_marca;
                    opt.textContent = marca.nombre;
                    selMarca.appendChild(opt);
                });
            } catch (error) {
                console.error("Error:", error);
            }
        }

        async function buscarCoches() {
            mostrarLoader(true);
            
            const formData = new FormData(formFiltros);
            const params = new URLSearchParams();
            
            for (const [key, value] of formData.entries()) {
                if (value) params.append(key, value);
            }

            try {
                const url = `/api/coches?${params.toString()}`;
                const response = await fetch(url);
                if (!response.ok) throw new Error('Error al buscar coches');
                
                todosLosCoches = await response.json();
                renderizarCoches(todosLosCoches);
            } catch (error) {
                console.error("Error:", error);
                mostrarMensaje("Ocurrió un error al conectar con la base de datos. Por favor, inténtalo de nuevo.", true);
            } finally {
                mostrarLoader(false);
            }
        }

        // RENDERIZADO DE INTERFAZ
        function mostrarLoader(mostrar) {
            if(mostrar) {
                gridCoches.innerHTML = '';
                loader.classList.remove('hidden');
                mensajeResultados.classList.add('hidden');
            } else {
                loader.classList.add('hidden');
            }
        }

        function mostrarMensaje(texto, esError = false) {
            mensajeResultados.classList.remove('hidden');
            const p = mensajeResultados.querySelector('p');
            p.textContent = texto;
            if (esError) {
                mensajeResultados.classList.replace('bg-blue-50', 'bg-red-50');
                mensajeResultados.classList.replace('border-blue-500', 'border-red-500');
                p.classList.replace('text-blue-800', 'text-red-800');
            } else {
                mensajeResultados.classList.replace('bg-red-50', 'bg-blue-50');
                mensajeResultados.classList.replace('border-red-500', 'border-blue-500');
                p.classList.replace('text-red-800', 'text-blue-800');
            }
        }

        function renderizarCoches(coches) {
            gridCoches.innerHTML = '';
            
            if (coches.length === 0) {
                mostrarMensaje("No hemos encontrado ningún coche con esos filtros. Prueba a relajar un poco la búsqueda.");
                return;
            }
            
            mensajeResultados.classList.add('hidden');

            coches.forEach(coche => {
                // Formatear precio
                const precioStr = new Intl.NumberFormat('es-ES', { style: 'currency', currency: 'EUR', maximumFractionDigits: 0 }).format(coche.precio_base);
                
                // Color de etiqueta según combustible
                let bgCombustible = "bg-slate-200 text-slate-800";
                if(coche.combustible.includes("Eléctrico")) bgCombustible = "bg-green-100 text-green-800 border border-green-300";
                else if(coche.combustible.includes("PHEV") || coche.combustible.includes("HEV")) bgCombustible = "bg-blue-100 text-blue-800 border border-blue-300";

                const isSeleccionado = cochesComparar.some(c => c.id_modelo === coche.id_modelo);
                
                const card = document.createElement('article');
                card.className = `card flex flex-col h-full ${isSeleccionado ? 'ring-4 ring-yellow-400' : ''}`;
                
                let imgUrl = coche.fuentes_modelo && coche.fuentes_modelo.url_imagen ? coche.fuentes_modelo.url_imagen : 'https://via.placeholder.com/600x400?text=Coche+sin+foto';

                card.innerHTML = `
                    <div class="relative h-56 bg-slate-200 overflow-hidden">
                        <img src="${imgUrl}" alt="${coche.marcas.nombre} ${coche.nombre}" class="w-full h-full object-cover" onerror="this.src='https://via.placeholder.com/600x400?text=Coche+sin+foto'">
                        <div class="absolute top-4 right-4 ${bgCombustible} px-3 py-1 rounded-full text-sm font-bold shadow-sm">
                            ${coche.combustible}
                        </div>
                    </div>
                    <div class="p-6 flex flex-col flex-grow">
                        <div class="uppercase tracking-wide text-sm text-blue-600 font-bold mb-1">${coche.marcas.nombre}</div>
                        <h3 class="text-2xl font-bold text-slate-900 mb-2 leading-tight">${coche.nombre} <span class="text-lg font-normal text-slate-500">${coche.carroceria}</span></h3>
                        
                        <div class="text-3xl font-bold text-slate-800 mt-2 mb-6">${precioStr}</div>
                        
                        <div class="grid grid-cols-2 gap-4 mb-6">
                            <div class="bg-slate-50 p-3 rounded-lg border border-slate-100 flex items-center gap-3">
                                <svg xmlns="http://www.w3.org/2000/svg" class="h-8 w-8 text-slate-400" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z" />
                                </svg>
                                <div>
                                    <div class="text-xs text-slate-500 uppercase font-semibold">Potencia</div>
                                    <div class="font-bold text-lg">${coche.cv} CV</div>
                                </div>
                            </div>
                            <div class="bg-slate-50 p-3 rounded-lg border border-slate-100 flex items-center gap-3">
                                <svg xmlns="http://www.w3.org/2000/svg" class="h-8 w-8 text-slate-400" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20 7l-8-4-8 4m16 0l-8 4m8-4v10l-8 4m0-10L4 7m8 4v10M4 7v10l8 4" />
                                </svg>
                                <div>
                                    <div class="text-xs text-slate-500 uppercase font-semibold">Maletero</div>
                                    <div class="font-bold text-lg text-green-700">${coche.maletero_litros || 'N/D'} L</div>
                                </div>
                            </div>
                        </div>
                        
                        <div class="mt-auto">
                            <button onclick="toggleComparar(${coche.id_modelo})" class="w-full ${isSeleccionado ? 'bg-yellow-400 hover:bg-yellow-500 text-slate-900 border-yellow-500' : 'btn-secondary'} rounded-xl py-3 text-lg font-bold flex justify-center items-center gap-2 transition-colors">
                                ${isSeleccionado ? 
                                    '<svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" viewBox="0 0 20 20" fill="currentColor"><path fill-rule="evenodd" d="M16.707 5.293a1 1 0 010 1.414l-8 8a1 1 0 01-1.414 0l-4-4a1 1 0 011.414-1.414L8 12.586l7.293-7.293a1 1 0 011.414 0z" clip-rule="evenodd" /></svg> Seleccionado para comparar' : 
                                    '<svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4" /></svg> Añadir a Comparativa'
                                }
                            </button>
                        </div>
                    </div>
                `;
                
                gridCoches.appendChild(card);
            });
        }

        // LÓGICA DE COMPARADOR
        window.toggleComparar = function(id_modelo) {
            const index = cochesComparar.findIndex(c => c.id_modelo === id_modelo);
            
            if (index > -1) {
                cochesComparar.splice(index, 1);
            } else {
                if (cochesComparar.length >= 3) {
                    alert("¡Solo puedes comparar un máximo de 3 coches a la vez para que sea fácil de leer!");
                    return;
                }
                const coche = todosLosCoches.find(c => c.id_modelo === id_modelo);
                if(coche) cochesComparar.push(coche);
            }
            
            actualizarBotonComparador();
            renderizarCoches(todosLosCoches); // Re-render para actualizar estado visual
        }

        function actualizarBotonComparador() {
            contadorCoches.textContent = cochesComparar.length;
            if (cochesComparar.length > 0) {
                btnVerComparador.classList.remove('hidden');
                btnVerComparador.classList.add('flex');
            } else {
                btnVerComparador.classList.add('hidden');
                btnVerComparador.classList.remove('flex');
            }
        }

        // MODAL COMPARADOR
        function abrirModal() {
            if (cochesComparar.length === 0) return;
            
            renderizarTablaComparativa();
            modalComparador.classList.remove('hidden');
            document.body.style.overflow = 'hidden'; // Evitar scroll de fondo
        }

        function cerrarModal() {
            modalComparador.classList.add('hidden');
            document.body.style.overflow = '';
        }

        function renderizarTablaComparativa() {
            // Limpiar tabla previa
            for (let i = 1; i <= 3; i++) {
                document.getElementById(`thCoche${i}`).innerHTML = '';
                document.getElementById(`tdPrecio${i}`).textContent = '';
                document.getElementById(`tdMotor${i}`).textContent = '';
                document.getElementById(`tdCV${i}`).textContent = '';
                document.getElementById(`tdConsumo${i}`).textContent = '';
                document.getElementById(`tdMaletero${i}`).textContent = '';
                document.getElementById(`tdDim${i}`).textContent = '';
                document.getElementById(`tdLinks1`).innerHTML = '';
                document.getElementById(`tdLinks2`).innerHTML = '';
                document.getElementById(`tdLinks3`).innerHTML = '';
            }

            cochesComparar.forEach((coche, index) => {
                const i = index + 1; // 1-based index para los IDs
                
                const formatPrecio = new Intl.NumberFormat('es-ES', { style: 'currency', currency: 'EUR', maximumFractionDigits: 0 }).format(coche.precio_base);
                let imgUrl = coche.fuentes_modelo && coche.fuentes_modelo.url_imagen ? coche.fuentes_modelo.url_imagen : 'https://via.placeholder.com/600x400?text=Coche+sin+foto';

                document.getElementById(`thCoche${i}`).innerHTML = `
                    <div class="flex flex-col items-center text-center">
                        <img src="${imgUrl}" class="h-32 object-contain mb-4 rounded bg-slate-50 w-full" alt="Imagen ${coche.nombre}">
                        <span class="text-sm text-blue-600 font-bold uppercase tracking-wider">${coche.marcas.nombre}</span>
                        <span class="text-2xl font-bold text-slate-800">${coche.nombre}</span>
                    </div>
                `;
                
                document.getElementById(`tdPrecio${i}`).textContent = formatPrecio;
                document.getElementById(`tdMotor${i}`).textContent = `${coche.combustible}`;
                document.getElementById(`tdCV${i}`).textContent = `${coche.cv} CV`;
                document.getElementById(`tdConsumo${i}`).textContent = `${coche.consumo ? coche.consumo : 'N/D'}`;
                document.getElementById(`tdMaletero${i}`).textContent = `${coche.maletero_litros || 'N/D'} L`;
                document.getElementById(`tdDim${i}`).innerHTML = `
                    <div class="text-base text-slate-600">
                        ${coche.largo} x ${coche.ancho} x ${coche.alto} mm
                    </div>
                `;
                
                // Enlaces externos
                const linksContainer = document.getElementById(`tdLinks${i}`);
                linksContainer.className = "p-4 border-t border-slate-200 flex flex-col gap-3";
                
                if (coche.fuentes_modelo?.url_oficial) {
                    linksContainer.innerHTML += `
                        <a href="${coche.fuentes_modelo.url_oficial}" target="_blank" rel="noopener noreferrer" class="btn-primary py-2 px-4 text-center text-base flex justify-center items-center gap-2">
                            <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" viewBox="0 0 20 20" fill="currentColor"><path d="M11 3a1 1 0 100 2h2.586l-6.293 6.293a1 1 0 101.414 1.414L15 6.414V9a1 1 0 102 0V4a1 1 0 00-1-1h-5z" /><path d="M5 5a2 2 0 00-2 2v8a2 2 0 002 2h8a2 2 0 002-2v-3a1 1 0 10-2 0v3H5V7h3a1 1 0 000-2H5z" /></svg>
                            Página Oficial
                        </a>
                    `;
                }
                if (coche.fuentes_modelo?.url_km77) {
                    linksContainer.innerHTML += `
                        <a href="${coche.fuentes_modelo.url_km77}" target="_blank" rel="noopener noreferrer" class="btn-secondary py-2 px-4 text-center text-base flex justify-center items-center gap-2 border border-slate-300">
                            <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 17v-2m3 2v-4m3 4v-6m2 10H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z" /></svg>
                            Ficha Técnica
                        </a>
                    `;
                }
            });
        }

        // EVENT LISTENERS
        formFiltros.addEventListener('submit', (e) => {
            e.preventDefault();
            buscarCoches();
        });

        btnLimpiar.addEventListener('click', () => {
            formFiltros.reset();
            buscarCoches();
        });

        btnVerComparador.addEventListener('click', abrirModal);
        btnCerrarModal.addEventListener('click', cerrarModal);
        btnVolverABuscar.addEventListener('click', cerrarModal);
        
        btnVaciarComparador.addEventListener('click', () => {
            cochesComparar = [];
            actualizarBotonComparador();
            cerrarModal();
            renderizarCoches(todosLosCoches);
        });

        // Cerrar modal al hacer click fuera
        modalComparador.addEventListener('click', (e) => {
            if (e.target === modalComparador) {
                cerrarModal();
            }
        });

    </script>
</body>
</html>
